<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" style="max-width:800px;width:100%">
  <title>C4 Nivel 1 — Diagrama de Contexto</title>
  <desc>Vista general del sistema Emergencias MVP mostrando ciudadanos, operadores, y sistemas externos</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 11px; fill: #666; }
    .box-label { font-size: 13px; font-weight: 600; fill: #fff; }
    .box-tech { font-size: 10px; fill: rgba(255,255,255,0.8); }
    .box-desc { font-size: 10px; fill: rgba(255,255,255,0.75); }
    .arrow-label { font-size: 10px; fill: #555; }
    .legend { font-size: 10px; fill: #888; }
  </style>

  <text x="400" y="30" text-anchor="middle" class="title">Nivel 1: Diagrama de Contexto</text>
  <text x="400" y="48" text-anchor="middle" class="subtitle">Sistema de Gestion de Emergencias Post-Sismo</text>

  <circle cx="160" cy="120" r="32" fill="#1168bd"/>
  <text x="160" y="116" text-anchor="middle" class="box-label" font-size="11">Ciudadano</text>
  <text x="160" y="130" text-anchor="middle" class="box-tech">[Persona]</text>
  <text x="160" y="170" text-anchor="middle" class="arrow-label">Reporta emergencias</text>
  <text x="160" y="182" text-anchor="middle" class="arrow-label">desde su celular</text>

  <circle cx="640" cy="120" r="32" fill="#1168bd"/>
  <text x="640" y="116" text-anchor="middle" class="box-label" font-size="11">Operador</text>
  <text x="640" y="130" text-anchor="middle" class="box-tech">[Persona]</text>
  <text x="640" y="170" text-anchor="middle" class="arrow-label">Despacha cuadrillas</text>
  <text x="640" y="182" text-anchor="middle" class="arrow-label">y monitorea zona</text>

  <rect x="250" y="240" width="300" height="90" rx="6" fill="#438dd5"/>
  <text x="400" y="270" text-anchor="middle" class="box-label">Emergencias MVP</text>
  <text x="400" y="286" text-anchor="middle" class="box-tech">[Sistema de software]</text>
  <text x="400" y="305" text-anchor="middle" class="box-desc">Recibe reportes, prioriza, despacha</text>
  <text x="400" y="317" text-anchor="middle" class="box-desc">cuadrillas y notifica organismos</text>

  <rect x="80" y="410" width="220" height="70" rx="6" fill="#999"/>
  <text x="190" y="438" text-anchor="middle" class="box-label">Supabase</text>
  <text x="190" y="454" text-anchor="middle" class="box-tech">[PostgreSQL + PostGIS + Auth]</text>
  <text x="190" y="468" text-anchor="middle" class="box-desc">Base de datos, RLS, Realtime</text>

  <rect x="500" y="410" width="220" height="70" rx="6" fill="#999"/>
  <text x="610" y="438" text-anchor="middle" class="box-label">Organismo Externo</text>
  <text x="610" y="454" text-anchor="middle" class="box-tech">[Sistema externo]</text>
  <text x="610" y="468" text-anchor="middle" class="box-desc">Recibe notificaciones via webhook</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <line x1="160" y1="152" x2="310" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="210" class="arrow-label">Envia reportes (HTTPS)</text>

  <line x1="640" y1="152" x2="490" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="210" class="arrow-label">Gestiona despachos</text>

  <line x1="340" y1="330" x2="220" y2="410" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="380" class="arrow-label">Lee/escribe datos (PostgREST)</text>

  <line x1="460" y1="330" x2="580" y2="410" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="380" class="arrow-label">Notifica (webhook)</text>

  <rect x="20" y="495" width="12" height="12" rx="6" fill="#1168bd"/>
  <text x="38" y="505" class="legend">Persona</text>
  <rect x="120" y="495" width="12" height="12" rx="2" fill="#438dd5"/>
  <text x="138" y="505" class="legend">Sistema interno</text>
  <rect x="260" y="495" width="12" height="12" rx="2" fill="#999"/>
  <text x="278" y="505" class="legend">Sistema externo</text>
</svg>
