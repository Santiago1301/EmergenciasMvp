[project]
name = "emergencias-common"
version = "0.1.0"
description = "Esquemas, cliente de Supabase y helpers de eventos compartidos por los microservicios de emergencias"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "supabase>=2.4",
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emergencias_common*"]
